<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent辅助分析与交付工作流证据图</title>
  <desc id="desc">展示从读取项目上下文、需求拆解到代码修改、构建验证和截图检查的AI Agent工作流。</desc>
  <rect width="1200" height="760" fill="#f8f8fb"/>
  <rect x="52" y="48" width="1096" height="664" rx="18" fill="#ffffff" stroke="#deddeb" stroke-width="2"/>
  <text x="92" y="104" fill="#25233a" font-family="Arial, sans-serif" font-size="34" font-weight="700">AI Agent 辅助分析与交付工作流</text>
  <text x="92" y="142" fill="#6b687f" font-family="Arial, sans-serif" font-size="18">把AI用于读取上下文、拆解需求、修改项目、构建验证和截图检查</text>
  <g font-family="Arial, sans-serif">
    <rect x="88" y="232" width="164" height="110" rx="14" fill="#f0f4ff" stroke="#a9b9ef"/>
    <text x="120" y="274" fill="#34447b" font-size="18" font-weight="700">读取上下文</text>
    <text x="120" y="306" fill="#66709a" font-size="14">CV / 项目 / 代码</text>
    <rect x="304" y="232" width="164" height="110" rx="14" fill="#eff8f6" stroke="#9bcfc5"/>
    <text x="336" y="274" fill="#2d6259" font-size="18" font-weight="700">拆解需求</text>
    <text x="336" y="306" fill="#5c817a" font-size="14">内容 / 页面 / 资产</text>
    <rect x="520" y="232" width="164" height="110" rx="14" fill="#fff6e9" stroke="#e0bb82"/>
    <text x="552" y="274" fill="#704d1d" font-size="18" font-weight="700">结构化输出</text>
    <text x="552" y="306" fill="#846b4b" font-size="14">字段 / 项目 / 证据</text>
    <rect x="736" y="232" width="164" height="110" rx="14" fill="#f7efff" stroke="#c9aee9"/>
    <text x="768" y="274" fill="#543574" font-size="18" font-weight="700">实现修改</text>
    <text x="768" y="306" fill="#765e8c" font-size="14">组件 / 样式 / 图片</text>
    <rect x="952" y="232" width="164" height="110" rx="14" fill="#f2f7ee" stroke="#adc991"/>
    <text x="984" y="274" fill="#425d2b" font-size="18" font-weight="700">验证交付</text>
    <text x="984" y="306" fill="#667b53" font-size="14">Build / 截图 / 修正</text>
  </g>
  <g stroke="#9290a4" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M252 287 H304"/>
    <path d="M468 287 H520"/>
    <path d="M684 287 H736"/>
    <path d="M900 287 H952"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9290a4"/>
    </marker>
  </defs>
  <rect x="92" y="438" width="1014" height="134" rx="14" fill="#f7f7fb" stroke="#dfdeea"/>
  <text x="124" y="480" fill="#2f2d46" font-family="Arial, sans-serif" font-size="20" font-weight="700">已经实现的用法</text>
  <text x="124" y="522" fill="#656278" font-family="Arial, sans-serif" font-size="16">读取项目结构和文件内容，定位页面组件和数据源；把模糊经历整理成可展示的项目案例；通过构建与截图验证页面交付。</text>
</svg>
