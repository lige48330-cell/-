<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">养殖渔业 ERP 从流程原型到配置核验的映射</title>
  <desc id="desc">基于内部交接方法脱敏重绘，展示角色场景、流程模型、对象字段状态、页面原型、低代码配置与单据核验之间的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#32685b" />
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#ebe7dd" />
  <rect x="38" y="38" width="1124" height="599" rx="22" fill="#fffdf8" stroke="#c9d1ca" stroke-width="2" />
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="78" y="98" fill="#17211d" font-size="31" font-weight="800">ERP DELIVERY MAP / PROTOTYPE TO SYSTEM</text>
    <text x="78" y="136" fill="#59675f" font-size="17">先对齐业务，再配置页面：每一步都留下团队可核对、可接手的产物</text>
    <rect x="900" y="72" width="222" height="42" rx="21" fill="#17211d" />
    <text x="1011" y="99" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">SANITIZED RECONSTRUCTION</text>

    <g>
      <rect x="78" y="196" width="184" height="190" rx="14" fill="#ffffff" stroke="#9eb6aa" stroke-width="2" />
      <text x="100" y="228" fill="#32685b" font-size="13" font-weight="700">01 / DISCOVERY</text>
      <text x="100" y="267" fill="#17211d" font-size="22" font-weight="800">角色与场景</text>
      <text x="100" y="304" fill="#59675f" font-size="15">谁在什么环节</text>
      <text x="100" y="332" fill="#59675f" font-size="15">执行什么动作</text>
      <text x="100" y="360" fill="#59675f" font-size="15">受哪些约束</text>

      <rect x="293" y="196" width="184" height="190" rx="14" fill="#edf3ef" stroke="#6f9582" stroke-width="2" />
      <text x="315" y="228" fill="#32685b" font-size="13" font-weight="700">02 / FLOW</text>
      <text x="315" y="267" fill="#17211d" font-size="22" font-weight="800">流程与事件</text>
      <text x="315" y="304" fill="#43564c" font-size="15">起点 / 环节 / 终点</text>
      <text x="315" y="332" fill="#43564c" font-size="15">事件与异常路径</text>
      <text x="315" y="360" fill="#43564c" font-size="15">功能结构表</text>

      <rect x="508" y="196" width="184" height="190" rx="14" fill="#ffffff" stroke="#9eb6aa" stroke-width="2" />
      <text x="530" y="228" fill="#32685b" font-size="13" font-weight="700">03 / MODEL</text>
      <text x="530" y="267" fill="#17211d" font-size="22" font-weight="800">对象与状态</text>
      <text x="530" y="304" fill="#59675f" font-size="15">主数据 / 事件流水</text>
      <text x="530" y="332" fill="#59675f" font-size="15">字段 / 权限 / 状态</text>
      <text x="530" y="360" fill="#59675f" font-size="15">报表投影边界</text>

      <rect x="723" y="196" width="184" height="190" rx="14" fill="#fff5ef" stroke="#c58b75" stroke-width="2" />
      <text x="745" y="228" fill="#9f4a33" font-size="13" font-weight="700">04 / PROTOTYPE</text>
      <text x="745" y="267" fill="#17211d" font-size="22" font-weight="800">页面原型</text>
      <text x="745" y="304" fill="#695047" font-size="15">页面流程 / 表单</text>
      <text x="745" y="332" fill="#695047" font-size="15">交互 / 状态反馈</text>
      <text x="745" y="360" fill="#695047" font-size="15">业务评审映射</text>

      <rect x="938" y="196" width="184" height="190" rx="14" fill="#17211d" stroke="#17211d" stroke-width="2" />
      <text x="960" y="228" fill="#b9d8cd" font-size="13" font-weight="700">05 / DELIVERY</text>
      <text x="960" y="267" fill="#ffffff" font-size="22" font-weight="800">配置与核验</text>
      <text x="960" y="304" fill="#d4ddd7" font-size="15">页面 / 流程配置</text>
      <text x="960" y="332" fill="#d4ddd7" font-size="15">关键单据路径</text>
      <text x="960" y="360" fill="#d4ddd7" font-size="15">限制与交接说明</text>

      <path d="M262 291H282" stroke="#32685b" stroke-width="4" marker-end="url(#arrow)" />
      <path d="M477 291H497" stroke="#32685b" stroke-width="4" marker-end="url(#arrow)" />
      <path d="M692 291H712" stroke="#32685b" stroke-width="4" marker-end="url(#arrow)" />
      <path d="M907 291H927" stroke="#32685b" stroke-width="4" marker-end="url(#arrow)" />
    </g>

    <rect x="78" y="430" width="1044" height="106" rx="12" fill="#f4f2eb" stroke="#d3d7d1" />
    <text x="100" y="462" fill="#9f4a33" font-size="13" font-weight="700">HANDOFF PACKAGE</text>
    <text x="100" y="500" fill="#17211d" font-size="18" font-weight="700">流程图</text>
    <text x="252" y="500" fill="#17211d" font-size="18" font-weight="700">功能结构表</text>
    <text x="445" y="500" fill="#17211d" font-size="18" font-weight="700">页面原型</text>
    <text x="610" y="500" fill="#17211d" font-size="18" font-weight="700">配置映射</text>
    <text x="775" y="500" fill="#17211d" font-size="18" font-weight="700">单据核验路径</text>
    <text x="982" y="500" fill="#17211d" font-size="18" font-weight="700">边界说明</text>

    <text x="78" y="585" fill="#6b756f" font-size="14">基于内部交接方法脱敏重绘｜客户、标识与业务数据已移除｜非原始公司文档</text>
  </g>
</svg>
