<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">工业设备 ERP 与物联网数据看板证据图</title>
  <desc id="desc">展示设备侧数据进入ERP系统并转化为看板指标和报表的路径。</desc>
  <rect width="1200" height="760" fill="#f6f8fb"/>
  <rect x="52" y="48" width="1096" height="664" rx="18" fill="#ffffff" stroke="#d9e1ea" stroke-width="2"/>
  <text x="92" y="104" fill="#172434" font-family="Arial, sans-serif" font-size="34" font-weight="700">工业设备 ERP / IoT 数据看板</text>
  <text x="92" y="142" fill="#647184" font-family="Arial, sans-serif" font-size="18">把设备侧数据整理成业务人员能查看、对比和分析的监控指标</text>
  <g font-family="Arial, sans-serif">
    <rect x="94" y="214" width="220" height="300" rx="14" fill="#f0f6ff" stroke="#a9c7ed"/>
    <text x="126" y="254" fill="#234666" font-size="20" font-weight="700">设备侧数据</text>
    <text x="126" y="296" fill="#58718a" font-size="15">温度</text>
    <text x="126" y="336" fill="#58718a" font-size="15">压力</text>
    <text x="126" y="376" fill="#58718a" font-size="15">运行状态</text>
    <text x="126" y="416" fill="#58718a" font-size="15">报警信号</text>
    <text x="126" y="456" fill="#58718a" font-size="15">生产过程数据</text>
    <rect x="482" y="214" width="236" height="300" rx="14" fill="#f7fbf1" stroke="#b8d58c"/>
    <text x="514" y="254" fill="#405d23" font-size="20" font-weight="700">数据整理</text>
    <text x="514" y="296" fill="#66794f" font-size="15">字段映射</text>
    <text x="514" y="336" fill="#66794f" font-size="15">指标命名</text>
    <text x="514" y="376" fill="#66794f" font-size="15">业务口径</text>
    <text x="514" y="416" fill="#66794f" font-size="15">展示层级</text>
    <text x="514" y="456" fill="#66794f" font-size="15">报表维度</text>
    <rect x="886" y="214" width="220" height="300" rx="14" fill="#fff5ea" stroke="#e2b37e"/>
    <text x="918" y="254" fill="#6a461c" font-size="20" font-weight="700">业务看板</text>
    <rect x="918" y="292" width="156" height="52" rx="8" fill="#ffffff" stroke="#ead4b6"/>
    <text x="942" y="324" fill="#6b5b47" font-size="14">设备状态</text>
    <rect x="918" y="366" width="156" height="52" rx="8" fill="#ffffff" stroke="#ead4b6"/>
    <text x="942" y="398" fill="#6b5b47" font-size="14">趋势报表</text>
    <rect x="918" y="440" width="156" height="52" rx="8" fill="#ffffff" stroke="#ead4b6"/>
    <text x="942" y="472" fill="#6b5b47" font-size="14">异常指标</text>
  </g>
  <g stroke="#8ea2b6" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M314 364 H482"/>
    <path d="M718 364 H886"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8ea2b6"/>
    </marker>
  </defs>
  <rect x="92" y="586" width="1014" height="76" rx="12" fill="#f7f9fb" stroke="#dce5ee"/>
  <text x="120" y="626" fill="#26384a" font-family="Arial, sans-serif" font-size="18" font-weight="700">我负责的部分</text>
  <text x="256" y="626" fill="#607082" font-family="Arial, sans-serif" font-size="16">设备数据接入相关功能 / 数据看板 / 报表展示 / 设备数据到业务指标的整理</text>
</svg>
