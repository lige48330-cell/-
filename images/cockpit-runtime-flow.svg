<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cockpit Tools Provider 配置与运行态生命周期</title>
  <desc id="desc">展示 React 配置界面、Tauri 异步命令、Rust 生命周期协调器和 Go Provider Gateway 之间的运行态关系，以及类型检查和回归验证。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#32685b" />
    </marker>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8" />
      <stop offset="1" stop-color="#edf3ee" />
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#ebe7dd" />
  <rect x="42" y="42" width="1116" height="676" rx="24" fill="url(#paper)" stroke="#c9d1ca" stroke-width="2" />
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="84" y="104" fill="#17211d" font-size="34" font-weight="800">PROVIDER RUNTIME / LIFECYCLE</text>
    <text x="84" y="145" fill="#59675f" font-size="18">配置写入不是完成：账号协议必须与真实运行态保持一致</text>
    <rect x="918" y="78" width="196" height="42" rx="21" fill="#32685b" />
    <text x="1016" y="105" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">FACT-BOUND SCHEMATIC</text>

    <rect x="84" y="188" width="1030" height="66" rx="12" fill="#f6e9e3" stroke="#d8a996" />
    <text x="112" y="216" fill="#813e2c" font-size="14" font-weight="700">FAILURE MODE</text>
    <text x="112" y="240" fill="#5f443b" font-size="16">协议切换后 gateway 未启动 / 旧 runtime 残留 / API Key 变化后旧账号运行态未清理</text>

    <g>
      <rect x="84" y="312" width="218" height="142" rx="16" fill="#ffffff" stroke="#9eb6aa" stroke-width="2" />
      <text x="108" y="345" fill="#32685b" font-size="13" font-weight="700">01 / REACT + TYPESCRIPT</text>
      <text x="108" y="382" fill="#17211d" font-size="22" font-weight="800">配置界面</text>
      <text x="108" y="413" fill="#59675f" font-size="15">Provider / API Key</text>
      <text x="108" y="438" fill="#59675f" font-size="15">Live Config / 保存状态</text>

      <rect x="356" y="312" width="218" height="142" rx="16" fill="#ffffff" stroke="#9eb6aa" stroke-width="2" />
      <text x="380" y="345" fill="#32685b" font-size="13" font-weight="700">02 / TAURI BRIDGE</text>
      <text x="380" y="382" fill="#17211d" font-size="22" font-weight="800">异步命令</text>
      <text x="380" y="413" fill="#59675f" font-size="15">等待后端协调完成</text>
      <text x="380" y="438" fill="#59675f" font-size="15">返回真实保存结果</text>

      <rect x="628" y="312" width="218" height="142" rx="16" fill="#e9f1ec" stroke="#6f9582" stroke-width="2" />
      <text x="652" y="345" fill="#32685b" font-size="13" font-weight="700">03 / RUST COORDINATOR</text>
      <text x="652" y="382" fill="#17211d" font-size="22" font-weight="800">生命周期协调</text>
      <text x="652" y="413" fill="#43564c" font-size="15">先停止 profile 旧 runtime</text>
      <text x="652" y="438" fill="#43564c" font-size="15">再按当前协议决定启动</text>

      <rect x="900" y="312" width="214" height="142" rx="16" fill="#ffffff" stroke="#c58b75" stroke-width="2" />
      <text x="924" y="345" fill="#a24d34" font-size="13" font-weight="700">04 / GO SIDECAR</text>
      <text x="924" y="382" fill="#17211d" font-size="22" font-weight="800">Provider Gateway</text>
      <text x="924" y="413" fill="#59675f" font-size="15">先清理 profile 旧 runtime</text>
      <text x="924" y="438" fill="#59675f" font-size="15">按 account requirement 协调</text>

      <path d="M302 383H345" stroke="#32685b" stroke-width="4" marker-end="url(#arrow)" />
      <path d="M574 383H617" stroke="#32685b" stroke-width="4" marker-end="url(#arrow)" />
      <path d="M846 383H889" stroke="#32685b" stroke-width="4" marker-end="url(#arrow)" />
    </g>

    <text x="84" y="524" fill="#17211d" font-size="17" font-weight="800">VERIFICATION LEDGER</text>
    <g font-size="15">
      <rect x="84" y="548" width="238" height="74" rx="12" fill="#17211d" />
      <text x="108" y="578" fill="#d9e8df" font-weight="700">TYPE SAFETY</text>
      <text x="108" y="603" fill="#ffffff">npm run typecheck  ✓</text>

      <rect x="338" y="548" width="300" height="74" rx="12" fill="#32685b" />
      <text x="362" y="578" fill="#dcebe4" font-weight="700">FOCUSED REGRESSION</text>
      <text x="362" y="603" fill="#ffffff">test:codex-api-key-scope  ✓</text>

      <rect x="654" y="548" width="214" height="74" rx="12" fill="#f1e4de" stroke="#d0a08e" />
      <text x="678" y="578" fill="#813e2c" font-weight="700">DIFF CHECK</text>
      <text x="678" y="603" fill="#5e433a">static assertions  ✓</text>

      <rect x="884" y="548" width="230" height="74" rx="12" fill="#f7f4ec" stroke="#c8c2b4" />
      <text x="908" y="578" fill="#5d655f" font-weight="700">KNOWN LIMIT</text>
      <text x="908" y="603" fill="#5d655f">Rust test 未本地执行</text>
    </g>
    <text x="84" y="680" fill="#6b756f" font-size="14">工程架构示意｜基于已核验的私有分支改造与验证记录，不是产品运行截图</text>
  </g>
</svg>
