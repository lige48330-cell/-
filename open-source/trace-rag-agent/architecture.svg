<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">TraceRAG Agent architecture</title>
  <desc id="desc">A traceable retrieval agent flow from business question to handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4efe7"/>
      <stop offset="1" stop-color="#e5f0ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#15231e" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#6d877b" stroke-width="3" stroke-linecap="round">
    <path d="M170 165h70M400 165h70M630 165h70M860 165h70M1090 165h50"/>
    <path d="m226 157 14 8-14 8M456 157l14 8-14 8M686 157l14 8-14 8M916 157l14 8-14 8M1120 157l14 8-14 8"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(38 95)"><rect width="132" height="140" rx="14" fill="#17211d"/><text x="18" y="38" fill="#aee0c8" font-size="12" font-weight="700">01 / INPUT</text><text x="18" y="78" fill="#fff" font-size="19" font-weight="700">业务问题</text><text x="18" y="106" fill="#c7d5cf" font-size="12">场景 + 约束</text></g>
    <g transform="translate(268 95)"><rect width="132" height="140" rx="14" fill="#fff" stroke="#c8d4cd"/><text x="18" y="38" fill="#b45b3f" font-size="12" font-weight="700">02 / INDEX</text><text x="18" y="78" fill="#17211d" font-size="19" font-weight="700">摄取检索</text><text x="18" y="106" fill="#5e6963" font-size="12">分块 + 证据</text></g>
    <g transform="translate(498 95)"><rect width="132" height="140" rx="14" fill="#fff" stroke="#c8d4cd"/><text x="18" y="38" fill="#32685b" font-size="12" font-weight="700">03 / ROUTE</text><text x="18" y="78" fill="#17211d" font-size="19" font-weight="700">Agent 路由</text><text x="18" y="106" fill="#5e6963" font-size="12">知识 / 动作</text></g>
    <g transform="translate(728 95)"><rect width="132" height="140" rx="14" fill="#fff" stroke="#c8d4cd"/><text x="18" y="38" fill="#32685b" font-size="12" font-weight="700">04 / GATE</text><text x="18" y="78" fill="#17211d" font-size="19" font-weight="700">人工闸门</text><text x="18" y="106" fill="#5e6963" font-size="12">确认 / 停止</text></g>
    <g transform="translate(958 95)"><rect width="170" height="140" rx="14" fill="#dbeee3" stroke="#32685b"/><text x="18" y="38" fill="#32685b" font-size="12" font-weight="700">05 / PROOF</text><text x="18" y="78" fill="#17211d" font-size="19" font-weight="700">回答 + 交接</text><text x="18" y="106" fill="#5e6963" font-size="12">引用 / trace / 下一步</text></g>
  </g>
  <text x="42" y="42" fill="#32685b" font-family="ui-monospace, monospace" font-size="12" font-weight="700">TRACEABLE AGENT DELIVERY / OFFLINE-FIRST PROTOTYPE</text>
</svg>
